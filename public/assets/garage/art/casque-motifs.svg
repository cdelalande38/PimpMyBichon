<?xml version="1.0" encoding="UTF-8"?>
<!--
  PimpMyBichon · garage · quatre décors de casque
  Planche 2 × 2 de cases 480 × 420, fond transparent. Casques intégraux de profil, écran à droite.
  Groupes : casque-flammes (noir mat), casque-bandes (blanc, bandes bleue et rouge),
  casque-crane (rouge, tête de mort), casque-damier (sarcelle pailleté, damier, éclair).
  Création originale pour le projet. Aucune police : tout lettrage est un tracé.
  Fichier produit par outils/fabriquer.mjs : pour changer le dessin, modifie le module puis relance.
-->
